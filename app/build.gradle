plugins { id 'com.android.application' }

android {
    namespace 'com.nivek.stlviewer'
    compileSdk 37
    defaultConfig {
        applicationId 'com.nivek.stlviewer'
        minSdk 26
        targetSdk 36
        versionCode 17
        versionName '1.6.5'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
            systemProperty 'cad.integration', project.hasProperty('cadIntegration').toString()
            systemProperty 'cad.outputDir', rootProject.file('build/cad-test').absolutePath
        }
    }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
}
