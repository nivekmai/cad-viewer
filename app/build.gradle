plugins { id 'com.android.application' }

android {
    namespace 'com.nivek.stlviewer'
    compileSdk 37
    defaultConfig {
        applicationId 'com.nivek.stlviewer'
        minSdk 26
        targetSdk 36
        versionCode 7
        versionName '1.4.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions {
        unitTests.all {
            systemProperty 'cad.integration', project.hasProperty('cadIntegration').toString()
            systemProperty 'cad.outputDir', rootProject.file('build/cad-test').absolutePath
        }
    }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
